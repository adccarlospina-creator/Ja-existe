<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#060910"><title>JÁ EXISTE?! — Descobertas e vídeos</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}html{scroll-snap-type:y mandatory;scroll-behavior:smooth}body{margin:0;background:#060910;color:#fff}header{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(14px + env(safe-area-inset-top)) 18px 15px;background:linear-gradient(#060910eb,transparent);pointer-events:none}.logo{font-size:clamp(24px,5vw,32px);font-weight:950;letter-spacing:-1.5px}.logo span{color:#72ffdc}.slide{height:100svh;min-height:500px;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;align-items:flex-end;overflow:hidden;isolation:isolate;padding:115px max(20px,calc((100vw - 650px)/2)) calc(91px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 30%,var(--glow),#060910 74%)}.slide:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,#060910ad 65%,#060910 100%);z-index:-1}.symbol{position:absolute;top:23%;left:50%;transform:translateX(-50%);font-size:clamp(100px,28vw,170px);filter:drop-shadow(0 8px 35px #000a)}.info{width:100%;max-width:620px;position:relative;z-index:2}.tag{display:inline-block;border:1px solid #73ffdc77;background:#0a3029b9;border-radius:20px;padding:7px 12px;font-size:11px;font-weight:850;letter-spacing:.7px;text-transform:uppercase;color:#8affdf}h1{font-size:clamp(32px,8vw,55px);line-height:1.05;letter-spacing:-1.4px;margin:13px 0}p{font-size:clamp(15px,3.8vw,19px);line-height:1.45;color:#e5edf5;margin:10px 0 18px}.buttons{display:flex;flex-wrap:wrap;gap:10px}.buttons a,.buttons button,.play{border:1px solid #ffffff55;border-radius:30px;padding:12px 17px;font-size:14px;font-weight:850;text-decoration:none;cursor:pointer}.source,.play{background:#72ffdc;color:#071912;border-color:#72ffdc!important}.share{background:#ffffff25;color:#fff}.progress{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:12px;color:#c7d2e1}.hint{position:absolute;bottom:calc(48px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:10px;white-space:nowrap;color:#c5cedb}.rail{position:fixed;z-index:30;right:12px;top:47%;display:grid;justify-items:center;gap:5px}.rail button{width:49px;height:49px;border-radius:50%;background:#06111bcf;border:1px solid #ffffff77;color:#fff;font-size:24px}.rail small{font-size:10px}.video-stage{position:absolute;z-index:1;top:calc(94px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(94vw,560px);height:min(42svh,320px);border-radius:18px;overflow:hidden;border:1px solid #ffffff36;background:#05070e;display:grid;place-items:center}.video-stage iframe{width:100%;height:100%;border:0}.video-placeholder{width:100%;height:100%;display:grid;place-items:center;text-align:center;padding:18px;background:radial-gradient(circle at center,#20394d,#090d1a)}.video-placeholder .play{font-size:16px}.video-placeholder small{display:block;margin-top:12px;color:#cad5df}.video .info h1{font-size:clamp(27px,6vw,43px)}.video .info p{font-size:14px;margin:7px 0 12px}.video .info{padding-top:6px}.video .buttons a{font-size:13px}@media(max-height:730px){.slide{padding-bottom:calc(65px + env(safe-area-inset-bottom))}.symbol{top:18%;font-size:95px}.video-stage{height:33svh;top:calc(75px + env(safe-area-inset-top))}.video .info h1{font-size:26px}.hint{display:none}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.visit-counter{position:fixed;z-index:32;top:calc(72px + env(safe-area-inset-top));left:17px;opacity:.85}.visit-counter img{display:block;max-width:175px;height:auto}@media(max-height:600px){.visit-counter{top:calc(65px + env(safe-area-inset-top))}}</style></head><body><header><div class="logo">JÁ <span>EXISTE?!</span></div></header><div class="visit-counter" aria-label="Contador aproximado de visualizações"><img src="https://hits.sh/adccarlospina-creator.github.io/Ja-existe.svg?label=visualiza%C3%A7%C3%B5es&amp;color=72ffdc" alt="Visualizações do site" referrerpolicy="no-referrer"></div><main id="feed"></main><div class="rail"><button id="next" aria-label="Próximo">↓</button><small>PRÓXIMO</small></div><script>
const items=[{"type": "product", "emoji": "🥽", "cat": "Computação espacial", "title": "Um computador no ar?!", "desc": "O Apple Vision Pro permite ver aplicações em janelas virtuais à tua volta.", "url": "https://www.apple.com/apple-vision-pro/", "color": "#4e39b4"}, {"type": "product", "emoji": "💍", "cat": "Tecnologia vestível", "title": "Um anel que acompanha o teu sono?!", "desc": "O Oura Ring acompanha indicadores de sono, atividade e frequência cardíaca.", "url": "https://ouraring.com/", "color": "#1d7d9d"}, {"type": "product", "emoji": "🕶️", "cat": "Óculos inteligentes", "title": "Óculos que ajudam a traduzir?!", "desc": "Os Ray-Ban Meta oferecem funcionalidades inteligentes, incluindo tradução em determinados idiomas e regiões.", "url": "https://www.meta.com/ai-glasses/", "color": "#8b4d9e"}, {"type": "product", "emoji": "🤖", "cat": "Robótica doméstica", "title": "Um robô que lava o chão sozinho?!", "desc": "Existem aspiradores robóticos que aspiram, passam a mopa e usam bases de limpeza automática.", "url": "https://global.roborock.com/", "color": "#087e79"}, {"type": "product", "emoji": "🖨️", "cat": "Fabrico em casa", "title": "Imprimir objetos de verdade?!", "desc": "Uma impressora 3D doméstica transforma modelos digitais em objetos físicos.", "url": "https://bambulab.com/", "color": "#a36320"}, {"type": "video", "cat": "Vídeo completo · Nuno Agonia", "title": "Estes gadgets parecem ESTÚPIDOS… mas dão um jeitaço!", "id": "whaZIyAoJow", "color": "#8b3dc1"}, {"type": "video", "cat": "Vídeo completo · Nuno Agonia", "title": "Estes GADGETS quase se pagam SOZINHOS!", "id": "9ND_oGNPXN8", "color": "#1e8b9e"}, {"type": "video", "cat": "Vídeo completo · Nuno Agonia", "title": "Gadgets de 50€ que vais MESMO querer ter!", "id": "iYDhhJJUlX8", "color": "#a36b28"}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const feed=document.getElementById('feed');
feed.innerHTML=items.map((x,i)=>{const video=x.type==='video';const id=`descoberta-${i+1}`;const url=video?`https://www.youtube.com/watch?v=${x.id}`:x.url;return `<section class="slide ${video?'video':''}" id="${id}" style="--glow:${x.color}" aria-label="${video?'Vídeo':'Descoberta'} ${i+1} de ${items.length}">${video?`<div class="video-stage" data-id="${x.id}"><div class="video-placeholder"><div><button class="play" data-play="${x.id}">▶ Ver vídeo completo</button><small>Ao tocar, o vídeo é carregado do YouTube.</small></div></div></div>`:`<div class="symbol" aria-hidden="true">${x.emoji}</div>`}<div class="info"><div class="tag">${esc(x.cat)}</div><h1>${esc(x.title)}</h1><p>${video?'Vídeo do Nuno Agonia. Os produtos apresentados não foram verificados individualmente pelo JÁ EXISTE?!':esc(x.desc)}</p><div class="buttons"><a class="source" href="${url}" target="_blank" rel="noopener noreferrer">${video?'Abrir no YouTube ↗':'Fonte oficial ↗'}</a><button class="share" data-share="${i}">↗ Partilhar</button></div></div><div class="hint">DESLIZA PARA CIMA ↑</div><div class="progress">${i+1} / ${items.length}</div></section>`}).join('');
const slides=[...document.querySelectorAll('.slide')];
document.getElementById('next').addEventListener('click',()=>{const i=slides.reduce((b,s,j)=>Math.abs(s.getBoundingClientRect().top)<Math.abs(slides[b].getBoundingClientRect().top)?j:b,0);slides[(i+1)%slides.length].scrollIntoView({behavior:'smooth'})});
document.querySelectorAll('[data-play]').forEach(b=>b.addEventListener('click',()=>{const stage=b.closest('.video-stage');const id=stage.dataset.id;const iframe=document.createElement('iframe');iframe.src=`https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&playsinline=1&rel=0`;iframe.title='Vídeo de Nuno Agonia';iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';iframe.allowFullscreen=true;iframe.referrerPolicy='strict-origin-when-cross-origin';stage.replaceChildren(iframe)}));
const observer=new IntersectionObserver(entries=>{for(const e of entries){if(!e.isIntersecting){const frame=e.target.querySelector('iframe');if(frame){frame.remove();const stage=e.target.querySelector('.video-stage');if(stage){stage.innerHTML=`<div class="video-placeholder"><div><button class="play" data-replay="1">▶ Reproduzir novamente</button><small>Vídeo do YouTube</small></div></div>`;stage.querySelector('[data-replay]').addEventListener('click',()=>{const id=stage.dataset.id;const f=document.createElement('iframe');f.src=`https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&playsinline=1`;f.title='Vídeo de Nuno Agonia';f.allow='autoplay; encrypted-media; picture-in-picture';f.allowFullscreen=true;stage.replaceChildren(f)})}}}}},{threshold:.15});slides.forEach(s=>observer.observe(s));
document.querySelectorAll('[data-share]').forEach(b=>b.addEventListener('click',async()=>{const i=+b.dataset.share,x=items[i],url=location.href.split('#')[0]+'#descoberta-'+(i+1);try{if(navigator.share)await navigator.share({title:'JÁ EXISTE?! — '+x.title,url});else if(navigator.clipboard){await navigator.clipboard.writeText(url);alert('Ligação copiada!')}else prompt('Copia a ligação:',url)}catch(e){}}));
</script></body></html>
