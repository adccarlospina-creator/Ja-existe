<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#060910"><meta name="description" content="JÁ EXISTE?! Descobre tecnologias reais que parecem ficção científica."><title>JÁ EXISTE?! — Isto já é real</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}html{scroll-snap-type:y mandatory;scroll-behavior:smooth}body{margin:0;background:#060910;color:#fff}button,a{-webkit-tap-highlight-color:transparent}header{position:fixed;z-index:30;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:calc(15px + env(safe-area-inset-top)) 17px 15px;background:linear-gradient(#060910df,transparent);pointer-events:none}header>*{pointer-events:auto}.logo{font-size:clamp(23px,5vw,32px);font-weight:950;letter-spacing:-1.7px;text-shadow:0 2px 15px #000}.logo span{color:#72ffdc}.live{display:flex;align-items:center;gap:6px;border:1px solid #ffffff38;background:#0006;border-radius:30px;padding:8px 11px;font-size:10px;font-weight:800;letter-spacing:1px}.dot{width:7px;height:7px;border-radius:50%;background:#73ffdb;box-shadow:0 0 12px #73ffdb}.slide{position:relative;min-height:500px;height:100svh;scroll-snap-align:start;scroll-snap-stop:always;isolation:isolate;overflow:hidden;display:flex;align-items:flex-end;padding:120px max(20px,calc((100vw - 650px)/2)) calc(85px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 36%,var(--glow),#060910 70%)}.photo{position:absolute;inset:0;background-image:var(--photo);background-size:cover;background-position:center;filter:saturate(.82) contrast(1.1);opacity:.63;transform:scale(1.03)}.slide:before{content:"";position:absolute;z-index:1;inset:0;background:linear-gradient(180deg,#05071066 0%,#05071016 30%,#06091090 52%,#060910 95%)}.slide:after{content:"";position:absolute;z-index:1;inset:0;background:linear-gradient(90deg,#06091055,transparent 70%)}.glow{position:absolute;z-index:1;width:70vw;height:70vw;max-width:420px;max-height:420px;top:15%;left:50%;transform:translateX(-50%);border-radius:50%;box-shadow:0 0 130px 20px var(--glow);opacity:.3}.symbol{position:absolute;z-index:2;left:50%;top:24%;transform:translateX(-50%);font-size:clamp(95px,27vw,165px);filter:drop-shadow(0 12px 45px #000a);text-shadow:0 0 35px var(--glow)}.info{position:relative;z-index:3;max-width:620px;width:100%}.eyebrow{display:inline-flex;align-items:center;gap:7px;background:#09291fba;border:1px solid #71ffd56b;border-radius:50px;padding:7px 11px;color:#8affdf;font-size:11px;font-weight:900;letter-spacing:1.3px;text-transform:uppercase}.info h1{font-size:clamp(35px,8vw,58px);line-height:1.01;letter-spacing:-1.8px;margin:14px 0 12px;text-wrap:balance;text-shadow:0 2px 25px #000}.info p{font-size:clamp(16px,3.8vw,19px);line-height:1.46;margin:0 0 13px;color:#ecf2fb;text-shadow:0 2px 10px #000}.verified{font-size:12px;color:#b3d4d0;margin-bottom:17px}.buttons{display:flex;gap:10px;flex-wrap:wrap}.buttons a,.buttons button{border-radius:30px;border:1px solid #ffffff55;padding:12px 16px;font:inherit;font-weight:850;font-size:14px;cursor:pointer;text-decoration:none}.source{background:#72ffdc;color:#06150f;border-color:#72ffdc!important;box-shadow:0 5px 26px #72ffdc22}.share{background:#ffffff1e;color:white;backdrop-filter:blur(12px)}.photo-note{position:absolute;z-index:3;right:18px;top:calc(86px + env(safe-area-inset-top));font-size:10px;color:#ffffffbd;text-shadow:0 2px 10px #000;text-align:right}.progress{position:absolute;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(23px + env(safe-area-inset-bottom));font-size:12px;color:#d0d9e8;white-space:nowrap}.rail{position:fixed;z-index:25;right:12px;top:48%;display:flex;flex-direction:column;align-items:center;gap:11px}.rail button{width:49px;height:49px;border-radius:50%;background:#050b13ad;border:1px solid #ffffff50;color:#fff;font-size:22px;cursor:pointer;backdrop-filter:blur(8px)}.rail small{font-size:10px;font-weight:800;text-shadow:0 1px 7px #000}.toast{display:none;position:fixed;z-index:50;bottom:75px;left:50%;transform:translateX(-50%);background:#183b35;border:1px solid #75ffdc77;padding:12px 16px;border-radius:15px;font-size:14px;white-space:nowrap}.footer{position:absolute;z-index:3;bottom:calc(46px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:#ffffff8e;font-size:10px;white-space:nowrap}@media(min-width:750px){.slide{padding-bottom:100px}.rail{right:calc((100vw - 700px)/2)}}@media(max-height:680px){.symbol{top:16%;font-size:90px}.info h1{font-size:32px}.slide{padding-bottom:68px}.photo-note{top:70px}.progress{bottom:12px}.footer{display:none}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body>
<header><div class="logo">JÁ <span>EXISTE?!</span></div><div class="live"><span class="dot"></span> É REAL</div></header><main id="feed"></main><div class="rail"><button id="next" aria-label="Próxima descoberta">↓</button><small>PRÓXIMO</small></div><div class="toast" id="toast" role="status"></div>
<script>
/* As fotografias são fundos ilustrativos genéricos; não representam necessariamente os produtos descritos. */
const items=[
{emoji:'🥽',cat:'Computação espacial',title:'Um computador no ar?!',desc:'O Apple Vision Pro permite ver aplicações em janelas virtuais à tua volta. Parece ficção científica, mas já foi lançado.',status:'Produto real · Disponibilidade depende do país',url:'https://www.apple.com/apple-vision-pro/',color:'#4e39b4',image:'https://images.unsplash.com/photo-1535223289827-42f1e9919769?auto=format&fit=crop&w=1200&q=80'},
{emoji:'💍',cat:'Tecnologia vestível',title:'Um anel que acompanha o teu sono?!',desc:'O Oura Ring usa sensores para acompanhar indicadores de sono, atividade e frequência cardíaca.',status:'Produto real · Não substitui aconselhamento médico',url:'https://ouraring.com/',color:'#1d7d9d',image:'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1200&q=80'},
{emoji:'🕶️',cat:'Óculos inteligentes',title:'Óculos que ajudam a traduzir?!',desc:'Os Ray-Ban Meta têm funcionalidades inteligentes, incluindo tradução em determinados idiomas e regiões.',status:'Produto real · Funções variam por região',url:'https://www.meta.com/ai-glasses/',color:'#8b4d9e',image:'https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=1200&q=80'},
{emoji:'🤖',cat:'Robótica doméstica',title:'Um robô que lava o chão sozinho?!',desc:'Já existem aspiradores robóticos que aspiram, passam a mopa e utilizam bases de limpeza automática.',status:'Tecnologia real · Funcionalidades dependem do modelo',url:'https://global.roborock.com/',color:'#087e79',image:'https://images.unsplash.com/photo-1485827404703-89b55fcc595e?auto=format&fit=crop&w=1200&q=80'},
{emoji:'🖨️',cat:'Fabrico em casa',title:'Imprimir objetos de verdade?!',desc:'Uma impressora 3D doméstica consegue transformar um modelo digital num objeto físico, camada a camada.',status:'Tecnologia real · Requer materiais e cuidados',url:'https://bambulab.com/',color:'#a36320',image:'https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&w=1200&q=80'}
];
const feed=document.getElementById('feed');const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
feed.innerHTML=items.map((x,i)=>`<section class="slide" id="descoberta-${i+1}" style="--glow:${x.color};--photo:url('${x.image}')" aria-label="Descoberta ${i+1} de ${items.length}"><div class="photo" aria-hidden="true"></div><div class="glow" aria-hidden="true"></div><div class="symbol" aria-hidden="true">${x.emoji}</div><div class="photo-note">Imagem ilustrativa<br>Produto confirmado na fonte oficial</div><div class="info"><div class="eyebrow">✦ ${safe(x.cat)}</div><h1>${safe(x.title)}</h1><p>${safe(x.desc)}</p><div class="verified">✓ ${safe(x.status)}</div><div class="buttons"><a class="source" href="${x.url}" target="_blank" rel="noopener noreferrer">Isto existe mesmo? ↗</a><button class="share" data-share="${i}">↗ Partilhar</button></div></div><div class="footer">DESLIZA PARA CIMA ↑</div><div class="progress">${i+1} / ${items.length}</div></section>`).join('');
const slides=[...document.querySelectorAll('.slide')];document.getElementById('next').addEventListener('click',()=>{let index=slides.reduce((best,s,i)=>Math.abs(s.getBoundingClientRect().top)<Math.abs(slides[best].getBoundingClientRect().top)?i:best,0);slides[(index+1)%slides.length].scrollIntoView({behavior:'smooth'})});
document.querySelectorAll('[data-share]').forEach(b=>b.addEventListener('click',async()=>{let i=Number(b.dataset.share),x=items[i],url=location.href.split('#')[0]+'#descoberta-'+(i+1);try{if(navigator.share){await navigator.share({title:'JÁ EXISTE?! — '+x.title,text:x.desc,url})}else if(navigator.clipboard){await navigator.clipboard.writeText(url);let t=document.getElementById('toast');t.textContent='Ligação copiada!';t.style.display='block';setTimeout(()=>t.style.display='none',2200)}else{prompt('Copia a ligação:',url)}}catch(e){}}));
</script></body></html>
