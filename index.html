<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b1b"><title>JÁ EXISTE?! — Descobertas</title><style>*{box-sizing:border-box}html{scroll-snap-type:y mandatory;scroll-behavior:smooth}body{margin:0;background:#080b1b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{position:fixed;z-index:9;inset:0 0 auto;padding:18px 20px;background:linear-gradient(#080b1bee,transparent);display:flex;align-items:center;justify-content:space-between;gap:8px}header strong{font-size:clamp(22px,5vw,30px);letter-spacing:-1px}header strong span{color:#75f3d7}header small{font-size:10px;color:#d9e7f2}.slide{height:100svh;min-height:480px;scroll-snap-align:start;display:flex;align-items:flex-end;position:relative;overflow:hidden;padding:90px max(20px,calc((100vw - 650px)/2)) 80px;background:radial-gradient(ellipse at 50% 33%,var(--glow),transparent 55%),linear-gradient(#18203c,#080b1b 95%)}.slide:before{content:'';position:absolute;width:min(80vw,440px);aspect-ratio:1;border:1px solid #ffffff33;border-radius:50%;top:17%;left:50%;transform:translateX(-50%);box-shadow:0 0 70px #ffffff0b,inset 0 0 60px #ffffff0b}.slide:after{content:'';position:absolute;inset:40% 0 0;background:linear-gradient(transparent,#080b1b);pointer-events:none}.emoji{position:absolute;top:24%;left:50%;transform:translateX(-50%);font-size:clamp(100px,29vw,190px);filter:drop-shadow(0 18px 50px #0008)}.copy{z-index:2;position:relative;max-width:650px}.cat{color:#76f4d8;font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:850}.copy h1{font-size:clamp(34px,7vw,58px);letter-spacing:-1.7px;line-height:1.06;margin:12px 0}.copy p{color:#e1e7f2;font-size:clamp(16px,3.7vw,19px);line-height:1.5;margin:0 0 11px}.status{font-size:12px;color:#b1d7d4;margin-bottom:17px}.actions{display:flex;flex-wrap:wrap;gap:10px}.actions a,.actions button{font:inherit;font-size:14px;font-weight:750;padding:12px 16px;border-radius:30px;cursor:pointer;text-decoration:none}.official{background:#76f4d8;color:#071922;border:0}.share{background:#ffffff22;color:#fff;border:1px solid #ffffff77}.count{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:3;color:#c3d2e4;font-size:12px;white-space:nowrap}.next{position:fixed;right:12px;bottom:14px;z-index:10;border:1px solid #ffffff77;background:#1d2c49;color:white;padding:10px 14px;border-radius:40px;cursor:pointer}.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:12px;background:#283a56;z-index:15;display:none}@media(max-height:650px){.slide{padding-bottom:55px}.emoji{top:15%;font-size:100px}.copy h1{font-size:31px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}</style></head><body><header><strong>JÁ <span>EXISTE?!</span></strong><small>DESLIZA ↑ PARA DESCOBRIR</small></header><main id="feed"></main><button class="next" id="next">Próximo ↓</button><div class="toast" id="toast" role="status"></div><script>const items=[{emoji:'🥽',cat:'Computação espacial',title:'Um computador à tua volta?!',desc:'O Apple Vision Pro coloca aplicações em janelas virtuais no espaço que te rodeia. Já é um produto lançado.',status:'Produto real · Disponibilidade varia por país',url:'https://www.apple.com/apple-vision-pro/',color:'#5142a1'},{emoji:'💍',cat:'Tecnologia vestível',title:'Um anel que analisa o sono?!',desc:'O Oura Ring acompanha indicadores de sono, atividade e frequência cardíaca através de sensores num anel.',status:'Produto comercializado · Não substitui avaliação médica',url:'https://ouraring.com/',color:'#1c6887'},{emoji:'🕶️',cat:'Óculos inteligentes',title:'Óculos que ajudam a traduzir?!',desc:'Os Ray-Ban Meta incluem funções inteligentes e tradução em determinados idiomas e mercados.',status:'Produto comercializado · Funções dependem do país',url:'https://www.meta.com/ai-glasses/',color:'#86513e'},{emoji:'🤖',cat:'Robótica doméstica',title:'Um robô que limpa e lava o chão?!',desc:'Já existem aspiradores robóticos com lavagem e bases que tratam automaticamente das mopas.',status:'Tecnologia comercializada · Modelos variam',url:'https://global.roborock.com/',color:'#176a68'},{emoji:'🖨️',cat:'Fabrico em casa',title:'Fabricar peças em casa?!',desc:'As impressoras 3D domésticas conseguem criar objetos e peças físicas a partir de modelos digitais.',status:'Tecnologia comercializada · Requer materiais e cuidados',url:'https://bambulab.com/',color:'#8d542e'}];document.getElementById('feed').innerHTML=items.map((x,i)=>'<section class="slide" id="descoberta-'+(i+1)+'" style="--glow:'+x.color+'"><div class="emoji" aria-hidden="true">'+x.emoji+'</div><div class="copy"><div class="cat">✦ '+x.cat+'</div><h1>'+x.title+'</h1><p>'+x.desc+'</p><div class="status">'+x.status+'</div><div class="actions"><a class="official" href="'+x.url+'" target="_blank" rel="noopener noreferrer">Ver fonte oficial ↗</a><button class="share" data-share="'+i+'">↗ Partilhar</button></div></div><div class="count">'+(i+1)+' / '+items.length+' · Desliza para cima ↑</div></section>').join('');document.getElementById('next').onclick=()=>{const s=[...document.querySelectorAll('.slide')];const i=Math.max(0,Math.round(scrollY/innerHeight));s[(i+1)%s.length].scrollIntoView({behavior:'smooth'})};document.querySelectorAll('[data-share]').forEach(b=>b.onclick=async()=>{const i=+b.dataset.share,x=items[i],url=location.href.split('#')[0]+'#descoberta-'+(i+1);try{if(navigator.share)await navigator.share({title:'JÁ EXISTE?! — '+x.title,text:x.desc,url});else if(navigator.clipboard){await navigator.clipboard.writeText(url);const t=document.getElementById('toast');t.textContent='Ligação copiada!';t.style.display='block';setTimeout(()=>t.style.display='none',2000)}else prompt('Copia a ligação:',url)}catch(e){}});</script></body></html>
