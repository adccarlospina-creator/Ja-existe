name: Descobrir novidades para revisão
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recolher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recolher RSS
        run: python descobrir.py
      - name: Guardar sugestões
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sugestoes.json
          git diff --cached --quiet || (git commit -m "Atualizar sugestões de novidades" && git push)
